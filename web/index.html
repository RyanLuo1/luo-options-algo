<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme FOUC guard — runs before the bundle. Dark is the default
         everywhere; only /login honors a stored 'light' preference
         (localStorage key 'luo-theme'). Non-login routes always start dark
         (ThemeScope in src/main.jsx enforces this on navigation too). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('luo-theme')
          if (window.location.pathname.indexOf('/login') === 0 && stored === 'light') {
            document.documentElement.classList.remove('dark')
          } else {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Monospace numeric font (tabular figures). Falls back to the system
         monospace stack in --font-mono if the network font fails to load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>web</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
