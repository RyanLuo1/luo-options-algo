<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-label="">
  <!-- Luo Capital · hero backdrop · 4:3
       Flat abstract in the v1 palette. The setup-card cluster sits on top of this,
       covering the center, so all detail lives in the margins: three soft planes
       (the three legs) drifting up from bottom-left, and a scatter of tiles
       dissolving off the top-right. No gradients, no text. Ground #E6E1EB. -->
  <rect width="1600" height="1200" fill="#E6E1EB"/>

  <!-- three planes, bottom-left, rising toward the card stack -->
  <g transform="translate(120 1120) rotate(-14)">
    <rect x="0" y="-560" width="520" height="560" rx="48" fill="#FFFFFF" opacity=".55"/>
  </g>
  <g transform="translate(-40 1210) rotate(-14)">
    <rect x="0" y="-460" width="460" height="460" rx="48" fill="#EEE9FF" opacity=".9"/>
  </g>
  <g transform="translate(20 1040) rotate(-14)">
    <rect x="0" y="-300" width="300" height="300" rx="48" fill="#6547E6" opacity=".14"/>
  </g>

  <!-- one large quiet plane peeking at the top-right corner -->
  <g transform="translate(1180 -120) rotate(8)">
    <rect x="0" y="0" width="620" height="520" rx="48" fill="#FFFFFF" opacity=".6"/>
  </g>

  <!-- tile scatter, dissolving off the top-right (denser near the corner, sparser inward) -->
  <g fill="#6547E6">
    <rect x="1330" y="60"  width="72" height="72" rx="14"/>
    <rect x="1440" y="150" width="56" height="56" rx="12"/>
    <rect x="1240" y="180" width="44" height="44" rx="10"/>
    <rect x="1520" y="290" width="40" height="40" rx="10"/>
    <rect x="1150" y="80"  width="28" height="28" rx="8" opacity=".7"/>
    <rect x="1390" y="330" width="26" height="26" rx="8" opacity=".55"/>
    <rect x="1060" y="40"  width="20" height="20" rx="6" opacity=".45"/>
  </g>
  <g fill="#D4F53C">
    <rect x="1470" y="40"  width="60" height="60" rx="12"/>
    <rect x="1300" y="240" width="46" height="46" rx="10"/>
    <rect x="1560" y="190" width="30" height="30" rx="8"/>
    <rect x="1200" y="300" width="22" height="22" rx="6" opacity=".8"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="1400" y="230" width="52" height="52" rx="12" opacity=".9"/>
    <rect x="1250" y="110" width="36" height="36" rx="9"  opacity=".9"/>
    <rect x="1540" y="120" width="24" height="24" rx="7"  opacity=".85"/>
    <rect x="1130" y="200" width="18" height="18" rx="6"  opacity=".7"/>
  </g>
  <g fill="#15121A">
    <rect x="1350" y="170" width="30" height="30" rx="8" opacity=".85"/>
    <rect x="1500" y="240" width="18" height="18" rx="6" opacity=".7"/>
    <rect x="1180" y="140" width="14" height="14" rx="5" opacity=".6"/>
  </g>

  <!-- a few tiles drifting off the bottom-left planes, mirroring the scatter -->
  <g>
    <rect x="70"  y="760" width="40" height="40" rx="10" fill="#D4F53C"/>
    <rect x="30"  y="860" width="26" height="26" rx="8"  fill="#6547E6" opacity=".8"/>
    <rect x="140" y="700" width="22" height="22" rx="7"  fill="#15121A" opacity=".75"/>
    <rect x="90"  y="1110" width="34" height="34" rx="9" fill="#FFFFFF" opacity=".9"/>
    <rect x="200" y="1130" width="20" height="20" rx="6" fill="#6547E6" opacity=".6"/>
  </g>

  <!-- right-edge margin: two quiet lime and violet tiles so the strip beside the front card is not empty -->
  <rect x="1480" y="760" width="48" height="48" rx="12" fill="#EEE9FF"/>
  <rect x="1545" y="860" width="28" height="28" rx="8"  fill="#D4F53C" opacity=".9"/>
  <rect x="1500" y="1000" width="20" height="20" rx="6" fill="#6547E6" opacity=".5"/>
</svg>
